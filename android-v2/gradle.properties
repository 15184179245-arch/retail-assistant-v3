# ---- 构建配置（2026-09-17 效率定版）----
# JDK 固定：外部 IDE / 终端 / 其他 coding agent 未设 JAVA_HOME 时也能用对 JDK 17，
# 避免误用系统默认 JDK 导致编译失败。（本机专用路径，换机器需同步修改）
org.gradle.java.home=C:/Android/jdk-17.0.20+8

# 内存：6G 堆（实测 Kotlin+KSP 全量编译峰值 3.1G，留足余量避免 GC 挣扎）+ 1G 元空间
# ParallelGC 主打吞吐（构建是吞吐型负载，不是低延迟）
org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# 并发：8 Worker（本机 16 线程的一半，留出 IO/AAPT 余量）；
# 单模块工程，parallel 无收益且徒增文件锁风险，保持 false
org.gradle.workers.max=8
org.gradle.parallel=false
org.gradle.caching=true

# 配置缓存：砍掉每次构建 10s+ 的配置阶段（14s 空转 → 目标 3s 内）
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true

# 常驻 daemon（勿加 --no-daemon）：JVM 与 Kotlin 编译器类库全预热，
# 省掉每次 fork 新 JVM 的 10~15s。
# 注意：GRADLE_USER_HOME 必须指向工程内的 .gradle-home（见 .gitignore），
# 指向 D:\gradle_cache 等工程外路径时，沙箱会对 daemon 的 .tmp/*.part 写入报「拒绝访问」。
org.gradle.daemon=true

# 注意：以下两条曾被开启后引发 Gradle Worker 池死锁（线程互相 CountDownLatch 等待）
#   kapt.use.worker.api=true
#
# 【2026-09-17 关键修正】必须显式关掉 VFS 文件监听（Gradle 8.7 默认是 true！）
# 症状：compileDebugKotlin 报
#   java.io.IOException: Unable to delete directory '...app\build\tmp\kotlin-classes\debug'
#   Failed to delete some children ... a process has files open
# 机理：Windows 上 Gradle 的目录变更监听会持有目录句柄，反过来挡住它自己删除该目录。
# 该故障在「沙箱关闭」时同样复现，证明与沙箱无关 —— 是 Gradle/Windows 自身的坑。
org.gradle.vfs.watch=false

# 代理：本机 7892 端口代理已下线，禁止写入死代理，否则 Gradle 网络访问全部卡死
#   systemProp.http.proxyHost=127.0.0.1 / proxyPort=7892
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# ---- 密钥配置（源码/构建脚本零硬编码）----
GATEWAY_TOKEN=

# 编译策略：in-process —— Kotlin 编译器跑在 Gradle daemon 内，
# 配合常驻 daemon 可让编译器类库常驻预热，省掉独立 Kotlin daemon 的进程调度开销
kotlin.compiler.execution.strategy=in-process

# 允许 debug APK 在实体真机（Android 14/15/16）通过文件管理器直接安装，避免 testOnly 拦截闪退
android.injected.testOnly=false
