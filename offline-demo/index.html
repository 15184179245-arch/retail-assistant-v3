<header><h1>零售助手 V3</h1>
<p>查看库位、商品查询和价签指令。全部是合成数据，不连接企业系统或打印机。</p>
<form id="controls">
<label>商品关键字 <input id="query" value="演示耗材" maxlength="80"></label>
<label>价签大小 <select id="size"><option value="50">50 × 30 mm</option><option value="60">60 × 40 mm</option></select></label>
<button id="reload" type="submit">重新运行</button></form><small id="mode" role="status"></small></header>
<main>
<section><h2>库位与货架</h2><pre id="inventory"></pre></section>
<section><h2>商品查询</h2><pre id="results"></pre></section>
<section><h2>价签指令</h2><p>以下是实际标签布局代码生成的 TSPL 命令，仅展示，不发送。</p><pre id="label"></pre>
<details><summary>查看排版结构</summary><pre id="ops"></pre></details></section>
</main>

<script>
const q = id => document.getElementById(id);
function pretty(target, value) { q(target).textContent = JSON.stringify(value, null, 2); }
async function render() {
  let data;
  q('reload').disabled = true;
  try {
    if (location.protocol === 'file:') {
      data = JSON.parse(q('sample').textContent);
      q('mode').textContent = '免安装预览：显示 V3 程序实际生成并随仓库保存的合成结果。运行 run_demo.py 可现场执行。';
    } else {
      const response = await fetch('/api/demo?' + new URLSearchParams({q:q('query').value,size:q('size').value}), {cache:'no-store'});
      if (!response.ok) throw Error('请求失败');
      data = await response.json();
      q('mode').textContent = '实时本地运行：Python V3 核心刚刚重新查询内存数据库并生成标签。';
    }
    pretty('inventory', data.inventory_tree);
    pretty('results', data.search);
    q('label').textContent = data.print_tspl;
    pretty('ops', data.print_ops);
  } catch (_) {
    q('mode').textContent = '演示没有运行成功。请检查本地终端是否仍开着。';
  } finally { q('reload').disabled = false; }
}
q('controls').addEventListener('submit', event => { event.preventDefault(); render(); });
if (location.protocol === 'file:') q('controls').hidden = true;
render();
</script>
